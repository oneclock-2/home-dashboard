<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>윤우윤서네 대시보드</title>
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- 배경 사진 슬라이드 영역 -->
    <div class="bg-slideshow">
        <div class="slide active" style="background-image: url('photo1.jpg');"></div>
        <div class="slide" style="background-image: url('photo2.jpg');"></div>
    </div>
    <div class="bg-overlay"></div>

    <!-- 배경에 부착된 포스트잇들이 표시되는 영역 -->
    <div class="sticky-notes-container" id="stickyNotesContainer"></div>

    <!-- 우측 상단: 날씨 위젯 -->
    <div class="top-weather-widget" id="weatherWidget">
        <div class="widget-title">🌤️ 안양시 날씨</div>
        <div class="weather-box" id="weatherBox">
            <div class="weather-day-item" id="weatherToday">
                <span class="w-label">오늘</span>
                <span class="w-info">날씨 불러오는 중...</span>
            </div>
            <div class="weather-day-item" id="weatherTomorrow">
                <span class="w-label">내일</span>
                <span class="w-info">날씨 불러오는 중...</span>
            </div>
        </div>
    </div>

    <!-- 상단 확인된 체크리스트 영역 -->
    <div class="top-checklist-bar" id="checklistBar">
        <div class="checklist-title">📋 확인한 알림 사항</div>
        <div class="checklist-items" id="checklistItems"></div>
    </div>

    <!-- 메인 화면 시계 -->
    <div class="main-idle-content">
        <div class="clock" id="clock">00:00</div>
        <div class="status-badge">🟢 알림 수신 대기 중...</div>
    </div>

    <!-- 초강력 번쩍이는 알림 팝업 모달 -->
    <div class="modal-backdrop" id="messageModal">
        <div class="modal-content">
            <div class="modal-tag">🚨 새로운 긴급 알림 🚨</div>
            <div class="unconfirmed-container" id="unconfirmedContainer"></div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
