<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>윤우윤서네 대시보드</title>
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div class="brightness-overlay" id="brightnessOverlay"></div>

    <div class="bg-slideshow">
        <div class="slide active" style="background-image: url('photo1.jpg');"></div>
        <div class="slide" style="background-image: url('photo2.jpg');"></div>
    </div>
    <div class="bg-overlay"></div>

    <div class="sticky-notes-container" id="stickyNotesContainer"></div>

    <button class="settings-gear-btn" id="settingsGearBtn" title="환경설정">⚙️</button>
    
    <div class="log-trigger-wrapper" id="logTriggerWrapper">
        <button class="log-trigger-btn" id="logTriggerBtn">💊 윤우윤서 체온로그</button>
        <div class="log-mini-badge-bar" id="logMiniBadgeBar" style="display: none;" onclick="openLogPanelFromMini()">
            <div class="mini-badge-circle" id="miniBadgeCount">0</div>
            <div class="mini-summary-texts" id="miniSummaryTexts">최근 로그 요약...</div>
            <button class="mini-detail-btn">로그 상세보기</button>
        </div>
    </div>

    <!-- 로그 패널 -->
    <div class="log-panel" id="logPanel">
        <div class="log-panel-header">
            <span>📋 윤우윤서 체온로그</span>
            <div class="log-header-btns">
                <button class="log-filter-btn" id="logFilterBtn">🔍 사람별 보기</button>
                <button class="log-report-btn" id="logReportBtn">📊 로그전체리포트</button>
                <button class="log-hide-btn" id="logHideBtn">닫기</button>
            </div>
        </div>
        <div class="log-wizard-area" id="logWizardArea"></div>
        
        <div class="log-panel-footer-actions">
            <button class="log-total-delete-btn" id="logTotalDeleteBtn">🗑️ 전체 삭제</button>
        </div>

        <div class="log-list-area" id="logListArea"></div>
    </div>

    <!-- 환경설정 모달 -->
    <div class="report-modal-backdrop" id="settingsModal">
        <div class="report-modal-content" style="max-width: 500px; height: auto;">
            <div class="report-header">
                <h2>⚙️ 윤우윤서네 대시보드 환경설정</h2>
                <button class="report-close-btn" id="settingsCloseBtn">✕ 닫기</button>
            </div>
            <div style="padding: 20px; display: flex; flex-direction: column; gap: 24px; color: white;">
                <div>
                    <label style="font-size: 18px; font-weight: 700; color: #93C5FD; display: block; margin-bottom: 10px;">🚨 긴급 알림 글씨 크기 설정</label>
                    <div style="display: flex; gap: 10px;">
                        <button class="wizard-pill" onclick="changeAlertFontSize('90px')">보통 (90px)</button>
                        <button class="wizard-pill" onclick="changeAlertFontSize('120px')" style="background: #3B82F6; color: white;">크게 (120px)</button>
                        <button class="wizard-pill" onclick="changeAlertFontSize('150px')" style="background: #EF4444; color: white;">아주 크게 (150px)</button>
                    </div>
                </div>

                <div>
                    <label style="font-size: 18px; font-weight: 700; color: #93C5FD; display: block; margin-bottom: 10px;">🔊 알림 소리 볼륨 증폭 조절 (<span id="volumeLabel">100%</span>)</label>
                    <div style="display: flex; align-items: center; gap: 14px;">
                        <span style="font-size: 14px; color: #94A3B8;">기본</span>
                        <input type="range" id="volumeRange" min="0.5" max="2.0" step="0.1" value="1.0" style="flex: 1; accent-color: #3B82F6; height: 8px; cursor: pointer;" oninput="updateAlertVolume(this.value)">
                        <span style="font-size: 14px; color: #94A3B8;">2배 증폭</span>
                    </div>
                </div>

                <div>
                    <label style="font-size: 18px; font-weight: 700; color: #93C5FD; display: block; margin-bottom: 10px;">🌙 절전 모드 최소 밝기 조절</label>
                    <div style="display: flex; align-items: center; gap: 14px;">
                        <span style="font-size: 14px; color: #94A3B8;">밝음</span>
                        <input type="range" id="brightnessRange" min="0" max="0.85" step="0.05" value="0.6" style="flex: 1; accent-color: #3B82F6; height: 8px; cursor: pointer;" oninput="updateBrightnessLevel(this.value)">
                        <span style="font-size: 14px; color: #94A3B8;">어두움</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 📊 리포트 및 차트 모달 -->
    <div class="report-modal-backdrop" id="reportModal">
        <div class="report-modal-content">
            <div class="report-header">
                <h2>📊 아이들 투약 및 체온 타임라인 리포트 & 차트</h2>
                <div style="display: flex; gap: 10px; align-items: center;">
                    <button class="wizard-pill" style="background: #22C55E; color: white; padding: 10px 16px; font-size: 15px;" onclick="promptAndSaveCurrentLogs()">💾 현재 로그 저장하기</button>
                    <button class="wizard-pill" style="background: #8B5CF6; color: white; padding: 10px 16px; font-size: 15px;" id="toggleReportChartBtn" onclick="toggleReportView()">📈 차트보기</button>
                    <button class="report-close-btn" id="reportCloseBtn">✕ 닫기</button>
                </div>
            </div>
            
            <div id="savedLogsToolbar" style="background: rgba(255,255,255,0.06); padding: 12px 20px; border-radius: 12px; margin-bottom: 16px; display: flex; align-items: center; gap: 14px;">
                <span style="color: #93C5FD; font-weight: 700; font-size: 15px;">📂 저장된 과거 로그 불러오기:</span>
                <select id="savedLogsSelect" style="background: #1E293B; color: white; border: 1px solid #64748B; padding: 8px 12px; border-radius: 8px; font-weight: bold; flex: 1; max-width: 400px;"></select>
                <button class="wizard-pill" style="background: #3B82F6; color: white; padding: 8px 16px; font-size: 14px;" onclick="loadSelectedSavedLogs()">불러오기</button>
                <button class="wizard-pill" style="background: #DC2626; color: white; padding: 8px 14px; font-size: 14px;" onclick="deleteSelectedSavedLog()">삭제</button>
            </div>

            <div class="report-body" id="reportContainer"></div>

            <div id="reportChartContainer" style="display: none; flex: 1; flex-direction: column; gap: 16px; overflow-y: auto;">
                <div style="display: flex; gap: 14px; align-items: center; background: rgba(255,255,255,0.05); padding: 12px 20px; border-radius: 12px;">
                    <span style="color: #FACC15; font-weight: 700; font-size: 16px;">👤 차트 대상 선택:</span>
                    <button class="wizard-pill pill-yoonwoo" onclick="renderChartForPerson('윤우')">👦 윤우</button>
                    <button class="wizard-pill pill-yoonseo" onclick="renderChartForPerson('윤서')">👧 윤서</button>
                    <span id="chartTargetName" style="color: white; font-weight: 800; font-size: 18px; margin-left: 10px;">(현재: 윤우)</span>
                </div>
                <div style="flex: 1; background: #0F172A; border-radius: 16px; padding: 20px; position: relative; min-height: 450px; border: 1px solid rgba(255,255,255,0.1);">
                    <canvas id="healthChartCanvas"></canvas>
                </div>
            </div>
        </div>
    </div>

    <!-- 🌤️ 우측 상단 날씨 위젯 -->
    <div class="top-weather-widget" id="weatherWidget">
        <div class="widget-section-title">📍 경기도 안양시 날씨 | ⏰ 오늘 시간대별 (9시~0시)</div>
        <div class="weather-row-grid" id="weatherTodayRow">
            <div style="color: #94A3B8; font-size: 14px; padding: 6px;">로드 중...</div>
        </div>

        <div class="widget-section-title" style="margin-top: 12px;">📅 향후 6일치 주간 예보</div>
        <div class="weather-row-grid" id="weatherDailyRow">
            <div style="color: #94A3B8; font-size: 14px; padding: 6px;">로드 중...</div>
        </div>
    </div>

    <div class="top-checklist-bar" id="checklistBar">
        <div class="checklist-title">📋 확인한 알림 사항</div>
        <div class="checklist-items" id="checklistItems"></div>
    </div>

    <div class="center-clock-container" id="centerClockContainer">
        <div class="center-clock" id="centerClock">00:00</div>
    </div>

    <div class="main-idle-content" style="position: absolute; bottom: 40px; left: 40px; z-index: 5; color: white; text-shadow: 0 2px 10px rgba(0,0,0,0.4);">
        <div class="status-badge-wrapper">
            <div class="status-badge">🟢 윤우윤서네 대시보드 정상 작동 중</div>
            <div class="dad-credit-large">Designed & Developed by Dad❤️ &lt;PARK&gt;</div>
        </div>
    </div>

    <div class="modal-backdrop" id="messageModal">
        <div class="modal-content">
            <div class="modal-tag">🚨 새로운 긴급 알림 🚨</div>
            <div class="unconfirmed-container" id="unconfirmedContainer"></div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
